{% extends "base.html" %}

{% block content %}
<h1>Notes</h1>
<div class="row mt-4">
    {% for item in items %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ item.name }}</h5>
                <p class="card-text">{{ item.description }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
